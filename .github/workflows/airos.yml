# Builds Telegram for air/OS (x86_64) on every push to airos and publishes
# the package to the rolling "latest" release, with links in the README.
# The pipeline lives in airos-works/airos-ci (apps/build-app-packages.sh,
# build_telegram), which runs this repository's airos/build.sh. Upstream's
# workflows (Linux, macOS, Windows, Snap, issue bots) are not run here.
name: air/OS build

on:
  push:
    branches: [airos]
  workflow_dispatch:

jobs:
  airos:
    uses: airos-works/airos-ci/.github/workflows/app.yml@main
    with:
      app: telegram
      repo-dir: tdesktop
      architectures: x86_64
      submodules: true
    permissions:
      contents: write
